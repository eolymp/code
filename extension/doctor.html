<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'nonce-{{nonce}}'; font-src {{source}}; script-src 'nonce-{{nonce}}';">
<style nonce="{{nonce}}">
  @font-face { font-family: codicon; src: url('{{font}}') format('truetype'); }
  body { margin: 0; padding: 0 20px; font-family: var(--vscode-font-family); font-size: var(--vscode-font-size); color: var(--vscode-foreground); }
  main { max-width: 680px; margin: 0 auto; padding: 48px 0; }
  h2 { margin: 0 0 5px; font-size: 1.5em; font-weight: 400; }
  .lead { margin: 0 0 24px; color: var(--vscode-descriptionForeground); line-height: 1.4; }
  .step { display: flex; gap: 12px; padding: 9px 12px; border: 1px solid transparent; border-radius: 6px; }
  .step.open { margin: 4px 0; padding: 12px; background: var(--vscode-welcomePage-tileBackground); border-color: var(--vscode-welcomePage-tileBorder); }
  .mark { flex: 0 0 16px; padding-top: 1px; font: 16px/1 codicon; color: var(--vscode-descriptionForeground); }
  .mark.ok { color: var(--vscode-welcomePage-progress-foreground, var(--vscode-textLink-foreground)); }
  .mark.bad { color: var(--vscode-errorForeground); }
  .mark.busy { animation: spin 1.5s steps(30) infinite; padding: 0; align-self: flex-start; margin-top: 1px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .text { min-width: 0; }
  .step.open .title { font-weight: 600; }
  .detail { margin-top: 4px; color: var(--vscode-descriptionForeground); line-height: 1.4; overflow-wrap: anywhere; }
  .actions { display: flex; align-items: center; gap: 12px; margin: 24px 12px 0; min-height: 28px; }
  #buttons { display: flex; gap: 8px; }
  button { font: inherit; color: var(--vscode-button-foreground); background: var(--vscode-button-background); border: 1px solid var(--vscode-button-border, transparent); border-radius: 2px; padding: 4px 14px; line-height: 18px; cursor: pointer; }
  button:hover { background: var(--vscode-button-hoverBackground); }
  button.quiet { color: var(--vscode-button-secondaryForeground); background: var(--vscode-button-secondaryBackground); }
  button.quiet:hover { background: var(--vscode-button-secondaryHoverBackground); }
  button:focus-visible { outline: 1px solid var(--vscode-focusBorder); outline-offset: 2px; }
  .progress { color: var(--vscode-descriptionForeground); }
</style>
</head>
<body>
<main>
<h2 id="title"></h2>
<p class="lead" id="lead"></p>
<div id="rows"></div>
<div class="actions"><span id="buttons"></span><span class="progress" id="progress"></span></div>
</main>
<script nonce="{{nonce}}">
  const vscode = acquireVsCodeApi();
  const STRINGS = {{strings}};
  const T = (text, ...args) => (STRINGS[text] || text).replace(/\{(\d)\}/g, (all, i) => args[i]);
  const el = (id) => document.getElementById(id);
  const make = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; };
  const button = (label, type, cls) => { const b = make('button', cls || '', label); b.onclick = () => vscode.postMessage({ type }); return b; };
  window.addEventListener('message', (event) => {
    const s = event.data;
    const rows = el('rows');
    const buttons = el('buttons');
    rows.textContent = '';
    buttons.textContent = '';
    el('progress').textContent = s.progress || (s.checks ? '' : T('Checking…'));
    const fixable = s.checks ? s.checks.some((c) => c.fix) : false;
    const broken = s.checks ? s.checks.some((c) => !c.ok) : false;
    el('lead').textContent = !s.checks ? '' : s.fresh && fixable ? T('Eolymp Code needs a compiler and Python. Install them to start solving problems.') : broken ? T('Some parts of Eolymp Code are not working.') : T('Everything works.');
    el('title').textContent = T('Diagnostics');
    for (const c of s.checks || []) {
      const working = Boolean(s.progress) && Boolean(c.fix);
      const row = make('div', c.ok ? 'step' : 'step open');
      const text = make('div', 'text');
      text.append(make('div', 'title', c.title));
      if (c.detail) text.append(make('div', 'detail', c.detail));
      row.append(make('span', working ? 'mark busy' : c.ok ? 'mark ok' : c.fix ? 'mark' : 'mark bad', String.fromCharCode(working ? 0xeb19 : c.ok ? 0xebb3 : c.fix ? 0xebb5 : 0xea87)), text);
      rows.append(row);
    }
    if (s.progress || !s.checks) return;
    if (fixable) buttons.append(button(s.fresh ? T('Install') : T('Fix'), 'fix'));
    buttons.append(button(T('Check again'), 'check', fixable ? 'quiet' : ''));
  });
  vscode.postMessage({ type: 'ready' });
</script>
</body>
</html>
