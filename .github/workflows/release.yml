name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  editor:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-22.04, ubuntu-22.04-arm, windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: app/.nvmrc
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install build libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y libkrb5-dev libx11-dev libxkbfile-dev libsecret-1-dev fakeroot
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Add swap (Linux)
        if: runner.os == 'Linux'
        run: sudo fallocate -l 8G /swap-build && sudo chmod 600 /swap-build && sudo mkswap /swap-build && sudo swapon /swap-build
      - name: Build the editor
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF" in refs/tags/v*) export EOLYMP_CODE_VERSION="${GITHUB_REF_NAME#v}" ;; esac
          ./app/build.sh build
      - name: Sign in to Azure Artifact Signing (Windows)
        if: runner.os == 'Windows' && vars.AZURE_SIGNING_CLIENT_ID != '' && startsWith(github.ref, 'refs/tags/v')
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign the programs (Windows)
        if: runner.os == 'Windows' && vars.AZURE_SIGNING_CLIENT_ID != '' && startsWith(github.ref, 'refs/tags/v')
        uses: azure/trusted-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293 # v0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: .build/vscodium/VSCode-win32-${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Package the editor
        env:
          CERTIFICATE_OSX_P12_DATA: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          CERTIFICATE_OSX_P12_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          CERTIFICATE_OSX_APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          CERTIFICATE_OSX_APP_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_PASSWORD || '' }}
          CERTIFICATE_OSX_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: ./app/build.sh package
      - name: Sign the setup program (Windows)
        if: runner.os == 'Windows' && vars.AZURE_SIGNING_CLIENT_ID != '' && startsWith(github.ref, 'refs/tags/v')
        uses: azure/trusted-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293 # v0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: artifacts
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: editor-${{ matrix.os }}
          path: artifacts/eolymp-code-*
          if-no-files-found: error

  language-packs:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: app/.nvmrc
      - name: Publish the language packs to Open VSX
        run: |
          for pack in l10n/*/; do
            id=$(node -p "const m = require('./${pack}package.json'); [m.publisher, m.name, m.version].join('/')")
            if curl -sf "https://open-vsx.org/api/$id" > /dev/null; then echo "$id is already published"; continue; fi
            (cd "$pack" && npx -y @vscode/vsce@4.1.1 package --no-dependencies -o "$RUNNER_TEMP/pack.vsix")
            npx -y ovsx@1.4.0 publish "$RUNNER_TEMP/pack.vsix" --trusted-publishing
          done

  publish:
    needs: editor
    runs-on: ubuntu-24.04
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: editor-*
          path: artifacts
          merge-multiple: true
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          role-to-assume: ${{ vars.AWS_PUBLISHER_ROLE }}
          aws-region: eu-central-1
      - name: Upload to downloads.eolymp.com
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          bucket="${{ vars.DOWNLOADS_BUCKET }}"
          version="${GITHUB_REF_NAME#v}"
          case "$version" in *-*) channel=pre/ ;; *) channel= ;; esac
          put() { aws s3 cp "$1" "$bucket/$channel$2" --cache-control "$3"; }
          for file in artifacts/eolymp-code-*; do
            name="$(basename "$file")"
            put "$file" "$version/${name%%.*}-$version.${name#*.}" "public, max-age=31536000, immutable"
          done
          for file in artifacts/eolymp-code-*; do
            put "$file" "$(basename "$file")" "public, max-age=300"
          done
          [ -n "$channel" ] || { jq --arg version "$version" '{version: $version} + .' app/download.json > latest.json; put latest.json latest.json "public, max-age=300"; }
      - name: Publish the apt repository
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          repo="$RUNNER_TEMP/apt"
          mkdir -p "$repo/pool"
          for deb in artifacts/eolymp-code-linux-*.deb; do
            cp "$deb" "$repo/pool/$(dpkg-deb -f "$deb" Package)_$(dpkg-deb -f "$deb" Version)_$(dpkg-deb -f "$deb" Architecture).deb"
          done
          cp app/apt/eolymp.asc "$repo/"
          cd "$repo"
          for arch in amd64 arm64; do
            mkdir -p "dists/stable/main/binary-$arch"
            apt-ftparchive --arch "$arch" packages pool > "dists/stable/main/binary-$arch/Packages"
            gzip -9kn "dists/stable/main/binary-$arch/Packages"
          done
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=Eolymp \
            -o APT::FTPArchive::Release::Label="Eolymp Code" \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures="amd64 arm64" \
            -o APT::FTPArchive::Release::Components=main \
            release dists/stable > "$RUNNER_TEMP/Release"
          mv "$RUNNER_TEMP/Release" dists/stable/Release
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          gpg --batch --yes --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg --batch --yes --armor --detach-sign -o dists/stable/Release.gpg dists/stable/Release
          bucket="${{ vars.APT_BUCKET }}"
          aws s3 cp pool "$bucket/pool" --recursive --cache-control "public, max-age=31536000, immutable"
          aws s3 cp eolymp.asc "$bucket/eolymp.asc" --cache-control "public, max-age=300"
          aws s3 cp dists "$bucket/dists" --recursive --exclude "stable/InRelease" --cache-control "no-cache"
          aws s3 cp dists/stable/InRelease "$bucket/dists/stable/InRelease" --cache-control "no-cache"
