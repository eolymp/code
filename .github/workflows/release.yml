name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  editor:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-22.04, ubuntu-22.04-arm, windows-2022]
    runs-on: ${{ matrix.os }}
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: app/.nvmrc
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install build libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y libkrb5-dev libx11-dev libxkbfile-dev libsecret-1-dev
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Add swap (Linux)
        if: runner.os == 'Linux'
        run: sudo fallocate -l 8G /swap-build && sudo chmod 600 /swap-build && sudo mkswap /swap-build && sudo swapon /swap-build
      - name: Import the Apple certificate (macOS)
        if: runner.os == 'macOS' && vars.APPLE_SIGN_IDENTITY != '' && startsWith(github.ref, 'refs/tags/v')
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p runner "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p runner "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k runner "$keychain"
          security list-keychain -d user -s "$keychain"
      - name: Build the editor
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF" in refs/tags/v*) export EOLYMP_CODE_VERSION="${GITHUB_REF_NAME#v}" ;; esac
          ./app/build.sh build
      - name: Sign in to Azure Artifact Signing (Windows)
        if: runner.os == 'Windows' && vars.AZURE_SIGNING_CLIENT_ID != '' && startsWith(github.ref, 'refs/tags/v')
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign the programs (Windows)
        if: runner.os == 'Windows' && vars.AZURE_SIGNING_CLIENT_ID != '' && startsWith(github.ref, 'refs/tags/v')
        uses: azure/trusted-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293 # v0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: .build/vscodium/VSCode-win32-x64
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Package the editor
        env:
          EOLYMP_CODE_SIGN_IDENTITY: ${{ startsWith(github.ref, 'refs/tags/v') && vars.APPLE_SIGN_IDENTITY || '' }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -n "$EOLYMP_CODE_SIGN_IDENTITY" ] && [ -n "$APPLE_API_KEY_CONTENT" ]; then
            echo "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/notary.p8"
            export APPLE_API_KEY="$RUNNER_TEMP/notary.p8"
          fi
          ./app/build.sh package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: editor-${{ matrix.os }}
          path: artifacts/EolympCode-*
          if-no-files-found: error

  publish:
    needs: editor
    runs-on: ubuntu-24.04
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: editor-*
          path: artifacts
          merge-multiple: true
      - name: Set the extension version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: cd extension && npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
      - name: Assemble everything the installers download
        run: ./build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          role-to-assume: ${{ vars.AWS_PUBLISHER_ROLE }}
          aws-region: eu-central-1
      - name: Upload to downloads.eolymp.com
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          bucket="${{ vars.DOWNLOADS_BUCKET }}"
          release="$(basename "$(ls -d dist/*/)")"
          aws s3 cp "dist/$release" "$bucket/$release" --recursive --cache-control "public, max-age=31536000, immutable"
          case "$GITHUB_REF_NAME" in *-*) channel=pre/ ;; *) channel= ;; esac
          for installer in install.sh install.ps1; do
            aws s3 cp "dist/$installer" "$bucket/$channel$installer" --cache-control "public, max-age=300"
          done
          for arch in arm64 x64; do
            aws s3 cp "$bucket/$release/$(basename dist/"$release"/EolympCode-darwin-"$arch"-*.dmg)" "$bucket/${channel}EolympCode-macos-$arch.dmg" --cache-control "public, max-age=300"
          done
      - name: Publish the extension to Open VSX and the Visual Studio Marketplace
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        env:
          OVSX_PAT: ${{ secrets.OVSX_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_TOKEN }}
        run: |
          vsix="$(ls dist/*/eolymp-code.vsix)"
          [ -z "$OVSX_PAT" ] || npx --yes ovsx@1.4.0 publish "$vsix"
          [ -z "$VSCE_PAT" ] || npx --yes @vscode/vsce@4.1.1 publish --packagePath "$vsix"
