<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'nonce-{{nonce}}'; font-src {{source}}; script-src 'nonce-{{nonce}}';">
<style nonce="{{nonce}}">
  @font-face { font-family: codicon; src: url('{{font}}') format('truetype'); }
  body { padding: 0 0 4px; font-family: var(--vscode-font-family); font-size: var(--vscode-font-size); color: var(--vscode-foreground); }
  button { font: inherit; font-family: var(--vscode-font-family); font-size: calc(var(--vscode-font-size) - 1px); color: var(--vscode-button-secondaryForeground); background: var(--vscode-button-secondaryBackground); border: 0; border-radius: 3px; padding: 2px 9px; cursor: pointer; white-space: nowrap; }
  button:hover { background: var(--vscode-button-secondaryHoverBackground); }
  button:focus-visible, a:focus-visible, summary:focus-visible { outline: 1px solid var(--vscode-focusBorder); outline-offset: -1px; }
  button.main { color: var(--vscode-button-foreground); background: var(--vscode-button-background); }
  button.main:hover { background: var(--vscode-button-hoverBackground); }
  .empty { margin: 8px 16px 0 8px; }
  .empty .actions { margin-top: 0; }
  .empty button { font-size: var(--vscode-font-size); padding: 4px 28px; }
  #head { display: flex; align-items: center; gap: 10px; box-sizing: border-box; height: 34px; margin-bottom: 4px; padding: 0 16px 0 8px; border-bottom: 1px solid var(--vscode-widget-border, color-mix(in srgb, var(--vscode-foreground) 12%, transparent)); white-space: nowrap; }
  #head .name { font-weight: 600; color: inherit; text-decoration: none; cursor: pointer; }
  #head .name:hover { text-decoration: underline; }
  #head .stats { flex: 1; color: var(--vscode-descriptionForeground); }
  #blocks { font-family: var(--vscode-terminal-font-family, var(--vscode-editor-font-family)); font-size: var(--vscode-editor-font-size); line-height: 1.5; }
  .block > summary { display: flex; align-items: center; gap: 6px; min-height: 22px; padding: 0 16px 0 8px; cursor: pointer; list-style: none; }
  .block > summary:hover { background: var(--vscode-list-hoverBackground); }
  .block > summary::-webkit-details-marker { display: none; }
  .block > summary::before { content: '\eab6'; flex: 0 0 16px; font: 16px/1 codicon; color: var(--vscode-icon-foreground); }
  .block[open] > summary::before { content: '\eab4'; }
  .block.leaf > summary, .block.fixed > summary { cursor: default; }
  .block.leaf > summary::before, .block.fixed > summary::before, .block.fixed[open] > summary::before { content: '\eb8a'; opacity: 0.6; }
  .mark { flex: 0 0 16px; font: 16px/1 codicon; -webkit-font-smoothing: antialiased; text-align: center; color: var(--vscode-descriptionForeground); }
  .mark.ok { color: var(--vscode-testing-iconPassed); }
  .mark.bad { color: var(--vscode-testing-iconFailed); }
  .mark.warn { color: var(--vscode-editorWarning-foreground); }
  .mark.busy { animation: spin 1.5s steps(30) infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .block .title { flex: 1 1 auto; min-width: 0; font-weight: 600; white-space: pre; overflow: hidden; text-overflow: ellipsis; }
  .block .title.comment { font-weight: normal; }
  .comment, .note, .block .stats { color: var(--vscode-descriptionForeground); }
  .block .stats, .block .cell { font-family: var(--vscode-font-family); font-size: calc(var(--vscode-font-size) * 0.9); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .block .cell { flex: 0 0 68px; text-align: right; opacity: 0.7; }
  .block .gap { flex: 0 0 22px; }
  .exit { color: var(--vscode-errorForeground); }
  .note { display: block; margin-top: 2px; font-style: italic; white-space: nowrap; }
  a.note { color: var(--vscode-textLink-foreground); text-decoration: none; cursor: pointer; }
  .block .body { position: relative; padding: 6px 16px 6px 52px; }
  .block .body:empty { display: none; }
  .block .body::before { content: ''; position: absolute; top: 0; bottom: 0; left: 15px; border-left: 1px solid var(--vscode-tree-indentGuidesStroke); }
  button.icon { flex: none; padding: 3px; border-radius: 4px; font: 16px/1 codicon; -webkit-font-smoothing: antialiased; color: var(--vscode-icon-foreground); background: transparent; }
  button.icon:hover { background: var(--vscode-toolbar-hoverBackground); }
  button.icon svg { display: block; fill: currentColor; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 6px; }
  pre { font: inherit; max-height: 240px; margin: 0; overflow: auto; white-space: pre; user-select: text; }
  pre.bad, pre .err { color: var(--vscode-terminal-ansiRed); }
  pre .in { color: var(--vscode-terminal-ansiCyan); }
  pre a { color: var(--vscode-textLink-foreground); text-decoration: none; cursor: pointer; }
  pre .stdlib { color: var(--vscode-descriptionForeground); }
  pre a:hover { color: var(--vscode-textLink-activeForeground); text-decoration: underline; }
  .stdin { display: flex; color: var(--vscode-terminal-ansiCyan); }
  .stdin input { flex: 1; font: inherit; color: inherit; background: transparent; border: 0; outline: 0; padding: 0; caret-shape: block; caret-color: var(--vscode-terminalCursor-foreground, var(--vscode-foreground)); }
</style>
</head>
<body>
<div id="head"></div>
<div id="empty" class="empty" hidden></div>
<div id="blocks"></div>
<script nonce="{{nonce}}">
  const vscode = acquireVsCodeApi();
  const STRINGS = {{strings}};
  const T = (text, ...args) => (STRINGS[text] || text).replace(/\{(\d)\}/g, (all, i) => args[i]);
  const ICONS = { check: 0xeba4, close: 0xea87, warning: 0xea6c, loading: 0xeb19, dot: 0xeb8a, stop: 0xead7, disconnect: 0xead0, rerun: 0xebc0, debug: 0xeb91 };
  const MARKS = { ok: 'check', bad: 'close', warn: 'warning', none: 'dot', busy: 'loading' };
  const trimmed = (name, test) => {
    const link = make('a', 'note', T('Output trimmed, open {0}', name));
    link.href = '#';
    link.onclick = (event) => { event.preventDefault(); vscode.postMessage({ type: 'output', test }); };
    return link;
  };
  const el = (id) => document.getElementById(id);
  const make = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; };
  const glyph = (name) => String.fromCharCode(ICONS[name]);
  const send = (message) => () => vscode.postMessage(message);
  const button = (label, message, cls) => {
    const b = make('button', cls || '', label);
    b.onclick = send(message);
    return b;
  };
  const actions = (...items) => { const div = make('div', 'actions'); div.append(...items); return div; };
  const mark = (kind, tip) => {
    const span = make('span', `mark ${kind}`, glyph(MARKS[kind]));
    span.title = tip;
    span.setAttribute('role', 'img');
    span.setAttribute('aria-label', tip);
    return span;
  };
  const icon = (name, tip, action) => {
    const b = make('button', 'icon', name ? glyph(name) : '');
    b.title = tip;
    b.setAttribute('aria-label', tip);
    b.onclick = (event) => { event.preventDefault(); event.stopPropagation(); action(b); };
    return b;
  };
  const more = () => {
    const b = icon('', T('More actions'), () => {
      const box = b.getBoundingClientRect();
      b.dispatchEvent(new MouseEvent('contextmenu', { bubbles: true, clientX: box.left, clientY: box.bottom }));
    });
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('width', '16');
    svg.setAttribute('height', '16');
    for (const x of [4, 8, 12]) {
      const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot.setAttribute('cx', x);
      dot.setAttribute('cy', 8);
      dot.setAttribute('r', 1.1);
      svg.append(dot);
    }
    b.append(svg);
    return b;
  };
  const folded = {};
  let typing = '';
  let shown = '';
  let scope = '';
  const block = (key, open, head, body, fixed) => {
    const details = make('details', fixed ? 'block fixed' : body.length ? 'block' : 'block leaf');
    details.dataset.key = key;
    const fold = `${scope}\n${key}`;
    details.open = fixed || (fold in folded ? !folded[fold] : open);
    details.ontoggle = () => { folded[fold] = !details.open; };
    const summary = make('summary');
    if (fixed || !body.length) {
      summary.tabIndex = -1;
      summary.onclick = (event) => event.preventDefault();
    }
    summary.append(...head);
    const inside = make('div', 'body');
    inside.append(...body);
    details.append(summary, inside);
    return details;
  };
  const STDLIB = [
    /[\\/]include[\\/](?:[^\\/]+[\\/])?c\+\+[\\/](?:v?[\d.]+[\\/])?(.+)$/,
    /[\\/]lib[\\/]gcc[\\/][^\\/]+[\\/][\d.]+[\\/]include(?:-fixed)?[\\/](.+)$/,
    /[\\/]usr[\\/]include[\\/](.+)$/,
    /[\\/]include[\\/](bits[\\/]stdc\+\+\.h)$/,
    /[\\/]lib(?:64)?[\\/]python\d[\d.]*[\\/](?!site-packages[\\/]|dist-packages[\\/])(.+)$/,
    /[\\/]python[^\\/]*[\\/]Lib[\\/](?!site-packages[\\/])(.+)$/i,
    /[\\/]python\d+\.zip[\\/](.+)$/i,
  ];
  const short = (file, root) => {
    for (const known of STDLIB) {
      const inside = known.exec(file);
      if (inside) return `stdlib:${inside[1].replace(/\\/g, '/')}`;
    }
    if (root && file.startsWith(root) && /[\\/]/.test(file[root.length])) return file.slice(root.length + 1).replace(/\\/g, '/');
    return file;
  };
  const goto = (file, root, line, column) => {
    const name = short(file, root);
    const text = `${name}${column ? `:${line}:${column}` : ''}`;
    if (name.startsWith('stdlib:')) return make('span', 'stdlib', text);
    const link = make('a', '', text);
    link.href = '#';
    link.title = file;
    link.onclick = (event) => { event.preventDefault(); vscode.postMessage({ type: 'goto', file, line, column: column || 1 }); };
    return link;
  };
  const traced = (text, root) => {
    const nodes = [];
    let at = 0;
    for (const frame of text.matchAll(/^([ |]*File ")([^"<\n]+)(?=", line (\d+))|^()([^\n]+?)(?=:(\d+): \w*Warning: )/gm)) {
      const [lead, file, line] = frame[2] ? [frame[1], frame[2], frame[3]] : ['', frame[5], frame[6]];
      nodes.push(text.slice(at, frame.index) + lead, goto(file, root, Number(line)));
      at = frame.index + frame[0].length;
    }
    nodes.push(text.slice(at));
    return nodes;
  };
  const compilerLog = (text, failed, root) => {
    const pre = make('pre', failed ? 'bad' : '');
    for (const line of text.split('\n')) {
      const place = /^(.+?):(\d+):(\d+)(?=: )/.exec(line);
      const from = /^(In file included from |\s+from )(.+?):(\d+)(?=[:,]$)/.exec(line);
      const scope = /^(.+?)(?=: (?:In|At) )/.exec(line);
      if (place) pre.append(goto(place[1], root, Number(place[2]), Number(place[3])), line.slice(place[0].length), '\n');
      else if (from) pre.append(from[1], goto(from[2], root, Number(from[3])), line.slice(from[0].length - from[3].length - 1), '\n');
      else if (scope) pre.append(short(scope[1], root), line.slice(scope[0].length), '\n');
      else pre.append(`${line}\n`);
    }
    return pre;
  };
  const place = (cards) => {
    const blocks = el('blocks');
    const old = new Map([...blocks.children].map((node) => [node.dataset.key, node]));
    let at = blocks.firstChild;
    for (const card of cards) {
      let node = old.get(card.node.dataset.key);
      old.delete(card.node.dataset.key);
      const fresh = !node || node.sign !== card.sign;
      const before = fresh && node && node.querySelector('pre');
      const top = before ? before.scrollTop : 0;
      if (fresh) {
        card.node.sign = card.sign;
        if (node) node.replaceWith(card.node);
        if (node && at === node) at = card.node;
        node = card.node;
      }
      if (node === at) at = at.nextSibling;
      else if (node.parentNode !== blocks || node.nextSibling !== at) blocks.insertBefore(node, at);
      if (!fresh && card.patch) card.patch(node);
      if (fresh && node.querySelector('pre')) node.querySelector('pre').scrollTop = top;
      if (fresh && card.placed) card.placed(node);
    }
    for (const node of old.values()) node.remove();
  };

  window.addEventListener('message', (event) => {
    const raw = JSON.stringify(event.data);
    if (raw === shown) return;
    shown = raw;
    const s = event.data;
    scope = s.path;
    const fresh = !s.steps && !s.session && !s.compileError && !s.testing;
    const empty = el('empty');
    empty.textContent = '';
    empty.hidden = !s.file || !fresh;
    if (!empty.hidden) {
      empty.append(actions(button(T('Run'), { type: 'single' }, 'main')));
    }

    const head = el('head');
    head.textContent = '';
    const link = () => {
      const name = make('a', 'name', s.file);
      name.href = '#';
      name.onclick = (event) => { event.preventDefault(); vscode.postMessage({ type: 'open' }); };
      return name;
    };
    if (!s.file) head.append(make('span', '', T('Open a .cpp or .py file to run it here.')));
    else if (fresh) {
      const [before, after] = T('Running {0} on your computer', '\n').split('\n');
      const what = make('span');
      what.append(before, link(), after || '');
      head.append(what);
    }
    if (s.file && !fresh) {
      const ran = Object.values(s.results);
      const answered = s.tests.filter((t) => t.answered).length;
      const tested = !s.session && (s.last === 'test' || (ran.length > 0 && !(s.steps && !s.steps.ok)));
      const score = tested && ran.length && answered ? T('{0}/{1} match', ran.filter((r) => r.verdict === 'match').length, answered) : '';
      const busy = s.testing || (s.session && s.session.state !== 'finished');
      const typing = s.session && s.session.state === 'running' && !s.session.closed;
      const name = link();
      const [before, after] = T(tested ? 'Testing {0} on your computer' : 'Running {0} on your computer', '\n').split('\n');
      const what = make('span');
      what.append(before, name, after || '');
      head.append(what, make('span', 'stats', score));
      vscode.postMessage({ type: 'tools', busy: Boolean(busy), typing: Boolean(typing), debug: Boolean(!busy && (tested ? s.only : s.session)), tested });
    } else vscode.postMessage({ type: 'tools', hidden: true });

    const cards = [];
    const command = (text) => make('span', 'title', text);
    const size = (bytes) => (bytes === undefined ? '' : T('{0} MB', (bytes / 1048576).toFixed(1)));
    const stats = (note, time, memory) => [make('span', 'stats', note || ''), make('span', 'cell', time || ''), make('span', 'cell', memory || '')];
    const compile = s.steps && s.steps.compile;
    if (compile || s.compileError) {
      const failed = s.steps ? !s.steps.ok : true;
      const sign = failed ? mark('bad', T('Compilation failed')) : s.compileError ? mark('warn', T('Compiled with warnings')) : mark('ok', T('Compiled'));
      const head = [sign, compile ? command(compile) : make('span', 'title comment', T('# compile'))];
      head.push(...stats(s.compileError ? (failed ? T('failed') : T('warnings')) : ''), make('span', 'gap'));
      const body = s.compileError ? [compilerLog(s.compileError, failed, s.root)] : [];
      if (s.setup) body.push(actions(button(T('Diagnostics'), { type: 'setup' })));
      cards.push({ sign: JSON.stringify([s.path, compile, s.compileError, failed, s.setup]), node: block('compile', Boolean(s.compileError), head, body) });
    }
    if (s.session && s.session.state !== 'compiling' && s.steps) {
      const x = s.session;
      const live = x.state === 'running';
      const sign = live ? mark('busy', T('Running')) : x.code === 0 ? mark('ok', T('Finished')) : mark('bad', x.stopped ? T('Stopped') : x.signal ? T('Crashed') : T('Finished with an error'));
      const head = [sign, command(s.steps.run)];
      if (!live) {
        head.push(...stats(x.stopped ? T('stopped') : '', x.ms === undefined ? '' : T('{0} ms', x.ms), size(x.memory)));
        head.push(!x.kept && x.typed && x.code === 0 ? more() : make('span', 'gap'));
      }
      const body = [];
      if (x.parts.length || live) {
        const pre = make('pre');
        for (const part of x.parts) {
          const span = make('span', part.kind, live || part.kind !== 'err' ? part.text : undefined);
          if (!span.firstChild) span.append(...traced(part.text, s.root));
          pre.append(span);
        }
        body.push(pre);
      }
      if (x.trimmed) body.push(trimmed('run.out'));
      if (live && !x.closed) {
        const line = make('div', 'stdin');
        const field = make('input');
        field.id = 'stdin';
        field.spellcheck = false;
        field.setAttribute('aria-label', T('Input for the program'));
        field.value = typing;
        field.oninput = () => { typing = field.value; };
        field.onkeydown = (e) => {
          if (e.key === 'Enter') { vscode.postMessage({ type: 'stdin', text: field.value }); typing = ''; field.value = ''; }
          if (e.ctrlKey && e.key === 'd') { e.preventDefault(); vscode.postMessage({ type: 'eof' }); }
          if (e.ctrlKey && e.key === 'c' && field.selectionStart === field.selectionEnd) vscode.postMessage({ type: 'stop' });
        };
        field.onpaste = (e) => {
          const lines = e.clipboardData.getData('text').replace(/\r/g, '').split('\n');
          if (lines.length < 2) return;
          e.preventDefault();
          lines[0] = field.value + lines[0];
          const rest = lines.pop();
          for (const text of lines) vscode.postMessage({ type: 'stdin', text });
          typing = rest;
          field.value = rest;
        };
        line.append(field);
        body.push(line);
      } else if (live) {
        typing = '';
        if (!x.debug) body.push(make('div', 'note', T('input ended')));
      } else {
        typing = '';
        if (!x.stopped && x.signal) body.push(make('div', 'exit', T('Crashed ({0})', x.signal)));
        else if (!x.stopped && x.code) body.push(make('div', 'exit', T('Exit code {0}', x.code)));
      }
      const card = block('run', true, head, body, true);
      if (!live && !x.kept && x.typed && x.code === 0) card.dataset.vscodeContext = JSON.stringify({ webviewSection: 'run', preventDefaultContextMenuItems: true });
      cards.push({
        sign: live ? JSON.stringify(['live', s.path, s.steps.run, Boolean(x.closed), x.trimmed]) : JSON.stringify([s.path, s.steps.run, x]),
        node: card,
        patch: live && ((node) => {
          const pre = node.querySelector('pre');
          const end = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 2;
          x.parts.forEach((part, i) => {
            const span = pre.children[i];
            if (!span) pre.append(make('span', part.kind, part.text));
            else if (span.textContent.length < part.text.length) span.append(part.text.slice(span.textContent.length));
          });
          if (end) pre.scrollTop = pre.scrollHeight;
        }),
        placed: live && ((node) => {
          node.querySelector('pre').scrollTop = node.querySelector('pre').scrollHeight;
          if (!el('stdin')) return;
          el('stdin').focus();
          el('stdin').setSelectionRange(typing.length, typing.length);
        }),
      });
    }
    const listing = !fresh && !s.session && !(s.steps && !s.steps.ok);
    for (const t of listing ? s.tests.filter((item) => s.results[item.id]) : []) {
      const r = s.results[t.id];
      const finished = r.verdict !== 'running';
      const run = s.steps && s.steps.run;
      const sign = r.verdict === 'no answer' ? mark('none', T('No answer to compare with'))
        : r.verdict === 'running' ? mark('busy', T('Running'))
        : r.verdict === 'match' ? mark('ok', T('The output matches the answer'))
        : mark('bad', r.verdict === 'differs' ? T('The output differs from the answer') : T(r.verdict));
      const head = [sign, run ? command(`${run} < ${t.id}.in`) : make('span', 'title comment', T('# test {0}', t.id))];
      const text = (r.stdout || '') + (r.stderr && r.stdout && !r.stdout.endsWith('\n') ? '\n' : '');
      const bad = finished && r.verdict !== 'match' && r.verdict !== 'no answer';
      const body = text || r.stderr ? [make('pre', bad ? 'bad' : '', text)] : [];
      if (r.stderr) body[0].append(...traced(r.stderr, s.root));
      if (r.trimmed) body.push(trimmed(`${t.id}.out`, t.id));
      if (finished && r.verdict === 'runtime error' && (r.signal || r.code)) body.push(make('div', 'exit', r.signal ? T('Crashed ({0})', r.signal) : T('Exit code {0}', r.code)));
      const failure = finished && r.verdict === 'runtime error' ? T(r.verdict) : '';
      const changed = finished && r.verdict === 'no answer' && r.changed ? T('output changed') : '';
      head.push(...stats(failure || changed, r.ms !== undefined ? T('{0} ms', r.ms) : '', size(r.memory)));
      head.push(more());
      const card = block(`test-${t.id}`, true, head, body);
      card.dataset.vscodeContext = JSON.stringify({
        webviewSection: 'test',
        test: t.id,
        hasAnswer: t.answered,
        canDiff: Boolean(finished && r.verdict === 'differs'),
        canAccept: Boolean(finished && r.verdict !== 'match' && r.verdict !== 'runtime error'),
        preventDefaultContextMenuItems: true,
      });
      cards.push({ sign: JSON.stringify([s.path, t, r, run]), node: card });
    }
    place(cards);
  });
  vscode.postMessage({ type: 'ready' });
</script>
</body>
</html>
